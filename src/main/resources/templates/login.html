<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management System - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border: 1px solid #ddd;
            padding: 40px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: normal;
            color: #333;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ddd;
            margin-bottom: 15px;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #999;
        }

        .btn-login {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            font-weight: normal;
            color: white;
            background-color: #333;
            border: none;
            cursor: pointer;
        }

        .btn-login:hover {
            background-color: #555;
        }

        .alert-error {
            background-color: #fee;
            color: #c33;
            border: 1px solid #fcc;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .alert-success {
            background-color: #efe;
            color: #3a3;
            border: 1px solid #cfc;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .app-title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <!-- Application Title -->
        <h1 class="app-title">Task Management System</h1>

        <!-- Error Message -->
        <div th:if="${param.error}" class="alert-error">
            Invalid username or password
        </div>

        <!-- Logout Message -->
        <div th:if="${param.logout}" class="alert-success">
            You have been logged out successfully
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <!-- Username Field -->
            <div class="form-group">
                <label for="username">Username</label>
                <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                        autofocus />
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label for="password">Password</label>
                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required />
            </div>

            <!-- Remember Me Checkbox -->
            <div class="form-group">
                <input
                        type="checkbox"
                        id="remember-me"
                        name="remember-me"
                        value="true" />
                <label for="remember-me" style="display: inline; margin-bottom: 0;">Remember me</label>
            </div>

            <!-- Login Button -->
            <button type="submit" class="btn-login">Sign In</button>
        </form>
    </div>
</div>
</body>
</html>
