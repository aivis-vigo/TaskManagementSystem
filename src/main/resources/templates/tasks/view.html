<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${task.key} + ' - ' + ${task.summary}">Task Details</title>
    <link rel="stylesheet" th:href="@{/css/tasks/view.css}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
          rel="stylesheet">
</head>
<body>
<main>
    <a class="back-link" th:href="@{/tasks}">&larr; Back to Task List</a>

    <div class="task-header">
        <span class="task-key" th:text="${task.key}"></span>
        <h2 th:text="${task.summary}"></h2>
    </div>

    <div class="task-meta">
        <span class="meta-pill" th:text="${task.type}"></span>
        <span class="meta-pill" th:text="${task.status}"></span>
        <span class="meta-pill" th:text="${task.priority}"></span>
    </div>

    <div class="task-body">
        <div class="detail-row">
            <span class="detail-label">Assignee</span>
            <span class="detail-value" th:text="${task.assignee} ?: 'Unassigned'"></span>
        </div>
        <div class="detail-row" th:if="${task.description != null and !task.description.isEmpty()}">
            <span class="detail-label">Description</span>
            <p class="detail-value" th:text="${task.description}"></p>
        </div>
    </div>

    <div class="task-actions" th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
        <a class="btn" th:href="@{/tasks/edit/{id}(id=${task.id})}">Edit</a>
        <a class="btn btn-danger" th:href="@{/tasks/delete/{id}(id=${task.id})}"
           onclick="return confirm('Are you sure you want to delete this task?');">Delete</a>
    </div>
</main>
</body>
</html>
