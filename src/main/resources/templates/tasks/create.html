<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Task</title>
</head>
<body>

<h2>Create New Task</h2>

<form th:action="@{/tasks/create}" th:object="${task}" method="post">

    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <label>Key:</label>
    <input type="text" th:field="*{key}" />
    <div th:if="${#fields.hasErrors('key')}" th:errors="*{key}" style="color:red"></div><br><br>

    <label>Summary:</label>
    <input type="text" th:field="*{summary}" />
    <div th:if="${#fields.hasErrors('summary')}" th:errors="*{summary}" style="color:red"></div><br><br>

    <label>Description:</label>
    <textarea th:field="*{description}"></textarea><br><br>

    <label>Task Type:</label>
    <select th:field="*{type}">
        <option th:each="type : ${types}"
                th:value="${type}"
                th:text="${type}">
        </option>
    </select>
    <br><br>

    <label>Status:</label>
    <select th:field="*{status}">
        <option th:each="status : ${statuses}"
                th:value="${status}"
                th:text="${status}">
        </option>
    </select>
    <br><br>

    <label>Priority:</label>
    <select th:field="*{priority}">
        <option th:each="priority : ${priorities}"
                th:value="${priority}"
                th:text="${priority}">
        </option>
    </select>
    <br><br>

    <label>Assignee:</label>
    <input type="text" th:field="*{assignee}" /><br><br>

    <button type="submit">Create Task</button>
</form>

<a href="/tasks">Back to Task List</a>

</body>
</html>
