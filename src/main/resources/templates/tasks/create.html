<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Task</title>
    <link rel="stylesheet" th:href="@{/css/tasks/create.css}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
          rel="stylesheet">
</head>
<body>
<main>
    <h2>Create Task</h2>
    <form th:action="@{/tasks/create}" th:object="${task}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-group">
            <label for="key">Key</label>
            <input type="text" id="key" th:field="*{key}"/>
            <div class="field-error" th:if="${#fields.hasErrors('key')}" th:errors="*{key}"></div>
        </div>

        <div class="form-group">
            <label for="summary">Summary</label>
            <input type="text" id="summary" th:field="*{summary}"/>
            <div class="field-error" th:if="${#fields.hasErrors('summary')}" th:errors="*{summary}"></div>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}"></textarea>
        </div>

        <div class="form-group">
            <label for="type">Task Type</label>
            <select id="type" th:field="*{type}">
                <option th:each="type : ${types}" th:value="${type}" th:text="${type}"></option>
            </select>
        </div>

        <div class="form-group">
            <label for="status">Status</label>
            <select id="status" th:field="*{status}">
                <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"></option>
            </select>
        </div>

        <div class="form-group">
            <label for="priority">Priority</label>
            <select id="priority" th:field="*{priority}">
                <option th:each="priority : ${priorities}" th:value="${priority}" th:text="${priority}"></option>
            </select>
        </div>

        <div class="form-group">
            <label for="assignee">Assignee</label>
            <input type="text" id="assignee" th:field="*{assignee}"/>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn">Create Task</button>
            <a class="btn btn-secondary" th:href="@{/tasks}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
