<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Task</title>
</head>
<body>

<h2>Create New Task</h2>

<form action="/tasks/create" th:object="${task}" method="post">
    <label>Key:</label>
    <input type="text" th:field="*{key}" />
    <div th:if="${#fields.hasErrors('key')}" th:errors="*{key}" style="color:red"></div><br><br>

    <label>Summary:</label>
    <input type="text" th:field="*{summary}" />
    <div th:if="${#fields.hasErrors('summary')}" th:errors="*{summary}" style="color:red"></div><br><br>

    <label>Description:</label>
    <textarea th:field="*{description}"></textarea><br><br>

    <label>Type:</label>
    <select th:field="*{type}">
        <option value="TASK">TASK</option>
        <option value="BUG">BUG</option>
        <option value="STORY">STORY</option>
    </select><br><br>
    <div th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>

    <label>Priority:</label>
    <select th:field="*{priority}">
        <option value="LOW">LOW</option>
        <option value="MEDIUM">MEDIUM</option>
        <option value="HIGH">HIGH</option>
        <option value="CRITICAL">CRITICAL</option>
    </select><br><br>
    <div th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}"></div>

    <label>Assignee:</label>
    <input type="text" th:field="*{assignee}" /><br><br>

    <button type="submit">Create Task</button>
</form>

<a href="/tasks">Back to Task List</a>

</body>
</html>
