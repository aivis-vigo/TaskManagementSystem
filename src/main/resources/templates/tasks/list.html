<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Task List</title>
    <link rel="stylesheet" th:href="@{/css/tasks/task-list.css}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto+Flex:opsz,wght,XOPQ,XTRA,YOPQ,YTDE,YTFI,YTLC,YTUC@8..144,100..1000,96,468,79,-203,738,514,712&display=swap"
          rel="stylesheet">
</head>
<body>
<main>
    <h2>Project Tickets</h2>

    <a class="btn" th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:href="@{/tasks/create/new}">+ New Task</a>

    <div class="task-grid">
        <div class="task-card" th:each="task : ${tasks}">
            <div class="card-header">
                <span class="task-key" th:text="${task.key}"></span>
                <span class="task-priority" th:text="${task.priority}"></span>
            </div>
            <h3 class="task-summary">
                <a th:href="@{/tasks/{id}(id=${task.id})}" th:text="${task.summary}"></a>
            </h3>
            <div class="card-details">
                <span class="task-type" th:text="${task.type}"></span>
                <span class="task-status" th:text="${task.status}"></span>
            </div>
            <div class="card-footer">
                <span class="task-assignee" th:text="${task.assignee}"></span>
                <div class="card-actions" th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                    <a th:href="@{/tasks/edit/{id}(id=${task.id})}">Edit</a>
                    <a th:href="@{/tasks/delete/{id}(id=${task.id})}"
                       onclick="return confirm('Are you sure you want to delete this task?');">Delete</a>
                </div>
            </div>
        </div>
    </div>

    <div class="logout-section">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button class="btn btn-secondary" type="submit">Logout</button>
        </form>
    </div>
</main>
</body>
</html>
