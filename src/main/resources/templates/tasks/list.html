<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Task List</title>
</head>
<body>

<h2>Task List</h2>

<!-- Add New Task for ADMIN -->
<a th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:href="@{/tasks/create/new}">Add New Task</a>

<table border="1" cellpadding="5">
    <thead>
    <tr>
        <th>ID</th>
        <th>Key</th>
        <th>Summary</th>
        <th>Type</th>
        <th>Status</th>
        <th>Priority</th>
        <th>Assignee</th>
        <th th:if="${#authorization.expression('hasRole(''ADMIN'')')}">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="task : ${tasks}">
        <td th:text="${task.id}"></td>
        <td th:text="${task.key}"></td>
        <td th:text="${task.summary}"></td>
        <td th:text="${task.type}"></td>
        <td th:text="${task.status}"></td>
        <td th:text="${task.priority}"></td>
        <td th:text="${task.assignee}"></td>
        <td th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
            <a th:href="@{/tasks/edit/{id}(id=${task.id})}">Edit</a> |
            <a th:href="@{/tasks/delete/{id}(id=${task.id})}"
               onclick="return confirm('Are you sure you want to delete this task?');">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

<!-- Logout -->
<div style="margin-top: 30px;">
    <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit" style="padding: 8px 15px; cursor: pointer;">
            Logout
        </button>
    </form>
</div>

</body>
</html>
