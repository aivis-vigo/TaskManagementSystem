<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Task List</title>
</head>
<body>

<h1>Task List</h1>

<a th:href="@{/tasks/create/new}">Add Task</a>

<table border="1" cellpadding="5" cellspacing="0">
    <tr>
        <th>ID</th>
        <th>Key</th>
        <th>Summary</th>
        <th>Description</th>
        <th>Type</th>
        <th>Status</th>
        <th>Priority</th>
        <th>Assignee</th>
        <th>Actions</th>
    </tr>
    <tr th:each="task : ${tasks}">
        <td th:text="${task.id}"></td>
        <td th:text="${task.key}"></td>
        <td th:text="${task.summary}"></td>
        <td th:text="${task.description}"></td>
        <td th:text="${task.type}"></td>
        <td th:text="${task.status}"></td>
        <td th:text="${task.priority}"></td>
        <td th:text="${task.assignee}"></td>
        <td>
            <a th:href="@{/tasks/edit/{id}(id=${task.id})}">Edit</a> |
            <a th:href="@{/tasks/delete/{id}(id=${task.id})}">Delete</a>
        </td>
    </tr>
</table>

</body>
</html>
