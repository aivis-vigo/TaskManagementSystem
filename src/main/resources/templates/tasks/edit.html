<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Task</title>
    <link rel="stylesheet" th:href="@{/css/tasks/create.css}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
          rel="stylesheet">
</head>
<body>
<main>
    <h2>Edit Task</h2>
    <form th:action="@{/tasks/edit/{id}(id=${task.id})}" th:object="${task}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-group">
            <label for="key">Key</label>
            <input type="text" id="key" th:field="*{key}"/>
        </div>

        <div class="form-group">
            <label for="summary">Summary</label>
            <input type="text" id="summary" th:field="*{summary}"/>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}"></textarea>
        </div>

        <div class="form-group">
            <label for="type">Type</label>
            <select id="type" th:field="*{type}">
                <option value="TASK">TASK</option>
                <option value="BUG">BUG</option>
                <option value="STORY">STORY</option>
            </select>
        </div>

        <div class="form-group">
            <label for="status">Status</label>
            <select id="status" th:field="*{status}">
                <option value="TODO">TODO</option>
                <option value="IN_PROGRESS">IN_PROGRESS</option>
                <option value="DONE">DONE</option>
            </select>
        </div>

        <div class="form-group">
            <label for="priority">Priority</label>
            <select id="priority" th:field="*{priority}">
                <option value="LOW">LOW</option>
                <option value="MEDIUM">MEDIUM</option>
                <option value="HIGH">HIGH</option>
                <option value="CRITICAL">CRITICAL</option>
            </select>
        </div>

        <div class="form-group">
            <label for="assignee">Assignee</label>
            <input type="text" id="assignee" th:field="*{assignee}"/>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn">Update Task</button>
            <a class="btn btn-secondary" th:href="@{/tasks}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
